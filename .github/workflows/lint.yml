name: lint

# This repository contains documentation only — there is no code to build or
# test. The only gate is that the Markdown stays well-formed and its internal
# links resolve.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  markdownlint:
    name: markdownlint
    runs-on: ubuntu-latest
    steps:
      # Every action is pinned to a full commit SHA, not to a tag: a tag can be
      # moved, a SHA cannot, so a third party cannot change what runs in your CI
      # without you changing a line here. The trailing comment records which
      # release the SHA belonged to when it was pinned. Bump both deliberately.
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Lint Markdown
        # Upstream documents `@main` for this one; a mutable ref is exactly what
        # the rule above exists to avoid. Rules live in .markdownlint-cli2.jsonc.
        uses: DavidAnson/markdownlint-cli2-action@6bf21b07787794f89a243495939cd651942aeabe # v24.1.0
        with:
          globs: "**/*.md"
